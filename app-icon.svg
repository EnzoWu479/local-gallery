<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Local Gallery: a matted piece hung on the green gallery wall. The brass
       disc reads as a sun in a landscape and as a record, for images and audio. -->
  <defs>
    <filter id="hang" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="22" />
    </filter>
    <clipPath id="artwork">
      <rect x="352" y="330" width="320" height="320" />
    </clipPath>
  </defs>

  <rect x="48" y="48" width="928" height="928" rx="208" fill="#22302b" />

  <rect x="262" y="276" width="500" height="500" fill="#0c1310" opacity="0.55" filter="url(#hang)" />
  <rect x="262" y="240" width="500" height="500" fill="#eceee9" />

  <g clip-path="url(#artwork)">
    <rect x="352" y="330" width="320" height="320" fill="#34453e" />
    <circle cx="582" cy="452" r="74" fill="#c9a65c" />
    <path d="M352 560 C 420 500 492 506 556 548 C 604 580 640 566 672 540 V650 H352 Z" fill="#22302b" />
  </g>
</svg>
